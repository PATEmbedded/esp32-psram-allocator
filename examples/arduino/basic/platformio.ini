; Builds the Arduino example against the library in this repository.

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps = symlink://../../..
; Arduino-ESP32 2.x compiles with C++11 by default; the library needs C++17.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM

[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -mfix-esp32-psram-cache-issue

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
